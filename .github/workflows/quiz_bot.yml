name: Telegram Quiz Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run twice daily at 9:00 AM and 5:00 PM UTC
    - cron: '30 3,14 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Add timeout to avoid hanging jobs

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run the script
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
      run: |
        python main.py
      continue-on-error: false  # Fail the workflow if the script fails
    
    - name: Log completion
      if: success()
      run: |
        echo "Quiz bot ran successfully at $(date)"
        
    - name: Log failure
      if: failure()
      run: |
        echo "Quiz bot failed at $(date)"
        echo "Check the logs for more information"
